name: ci

# Gate every PR AND every push to main with the same merge gate. This is the
# layer nobody can skip -- the repo's existing workflows are scheduled ingest
# crons + a push-triggered probe, none of which validate a PR before it lands.
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run merge gate
        run: sh scripts/ci_gate.sh
