name: Intraday options snapshots (SPY)

# SharpEdge 2.0: takes options chain snapshots 3x per trading day so snapshot
# diffing can catch intraday positioning flow (one snapshot is a photo,
# two are a story). Runs lean: no lint/test gates here (the nightly ingest
# workflow runs those); every step is fail-open except the commit.

on:
  workflow_dispatch:
  schedule:
    # 10:30, 13:00, 16:05 ET on weekdays
    - cron: "30 14 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "5 20 * * 1-5"

jobs:
  snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    env:
      SPY_DB_PATH: data/spy_truth.db
      SYMBOL: SPY
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_TIMEOUT: 120
      ALPACA_RETRIES: 6
      ALPACA_FAIL_OPEN: 1
      FLOW_MIN_OI: 1000
      FLOW_TOP_N: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Ingest SPY options chain snapshot
        continue-on-error: true
        run: |
          python scripts/ingest_alpaca_options_chain_snapshots.py || echo "WARN: snapshot ingest degraded" >> outputs/health/warnings.log

      - name: Aggregate options positioning (0-1 DTE)
        continue-on-error: true
        run: |
          DTE_MIN=0 DTE_MAX=1 python scripts/aggregate_options_positioning_metrics.py || echo "WARN: 0-1 DTE positioning degraded" >> outputs/health/warnings.log

      - name: Aggregate options positioning (2-3 DTE)
        continue-on-error: true
        run: |
          DTE_MIN=2 DTE_MAX=3 python scripts/aggregate_options_positioning_metrics.py || echo "WARN: 2-3 DTE positioning degraded" >> outputs/health/warnings.log

      - name: Diff snapshots into flow events
        run: |
          python scripts/diff_options_snapshots.py

      - name: Build options snapshot features
        run: |
          python scripts/build_options_snapshot_features.py

      - name: Commit updated DB + outputs
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ outputs/ || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Intraday options snapshots + flow events" || true
          git push || true
